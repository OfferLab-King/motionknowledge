name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit + integration tests
        run: pnpm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54332/postgres
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54331
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ env.SUPABASE_JWT_SECRET }}

      - name: Production build
        run: pnpm build

      - name: Short render smoke test
        run: pnpm --filter @motionknowledge/remotion-engine test:smoke

  database-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Enable corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Start local Supabase
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0
      - name: Supabase start
        run: supabase start
      - name: Run Supabase migrations
        run: supabase db reset
      - name: Database integration tests (RLS, idempotency)
        run: pnpm --filter @motionknowledge/database test:integration && pnpm --filter @motionknowledge/jobs test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54332/postgres
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54331
